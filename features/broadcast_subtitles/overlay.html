<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Metagrafo overlay</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
    }
    #stage {
      position: absolute;
      box-sizing: border-box;
      width: var(--box-w);
      max-width: calc(100% - 2 * var(--inset-h));
      max-height: var(--box-h);
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.6s;
      --inset-v: 1%;
      --inset-h: 1%;
      --box-w: 100%;
      --box-h: 30%;
    }
    #stage.hidden { opacity: 0; }
    #stage.pos-top_left {
      top: var(--inset-v);
      left: var(--inset-h);
      right: auto;
      bottom: auto;
      text-align: left;
    }
    #stage.pos-top_center {
      top: var(--inset-v);
      left: var(--inset-h);
      right: var(--inset-h);
      bottom: auto;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }
    #stage.pos-bottom_center {
      top: auto;
      left: var(--inset-h);
      right: var(--inset-h);
      bottom: var(--inset-v);
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }
    .line {
      color: #fff;
      font-size: 2.5vw;
      font-weight: 700;
      text-shadow:
        0 0 6px #000,
        0 2px 8px #000,
        2px 2px 0 #000,
        -2px 2px 0 #000,
        2px -2px 0 #000,
        -2px -2px 0 #000;
      line-height: 1.25;
      margin: 0.15em 0;
      overflow-wrap: normal;
      word-break: normal;
    }
    .line:empty {
      display: none;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="stage" class="hidden pos-top_left">
    <div id="lines"></div>
  </div>
  <script>
    const stage = document.getElementById("stage");
    const linesEl = document.getElementById("lines");
    const POSITIONS = ["pos-top_left", "pos-top_center", "pos-bottom_center"];
    let hideTimer = null;
    let lineCount = 2;
    let fontSizeVw = 2.5;

    function lineTexts() {
      return [...linesEl.querySelectorAll(".line")].map((el) => el.textContent);
    }

    function renderLines(texts) {
      linesEl.replaceChildren();
      for (const text of texts) {
        const p = document.createElement("p");
        p.className = "line";
        p.textContent = text;
        p.style.fontSize = fontSizeVw + "vw";
        linesEl.appendChild(p);
      }
    }

    function setLineCount(count) {
      const nextCount = count;
      const kept = lineTexts().filter((text) => text).slice(-nextCount);
      const texts = Array(nextCount).fill("");
      for (let i = 0; i < kept.length; i++) {
        texts[nextCount - kept.length + i] = kept[i];
      }
      lineCount = nextCount;
      renderLines(texts);
    }

    function pushText(text) {
      const texts = lineTexts();
      while (texts.length < lineCount) texts.unshift("");
      const next = texts.slice(-lineCount);
      next.shift();
      next.push(text);
      renderLines(next);
    }

    setLineCount(2);

    function applyStyle(msg) {
      if (msg.position) {
        stage.classList.remove(...POSITIONS);
        stage.classList.add("pos-" + msg.position);
      }
      if (typeof msg.font_size_vw === "number") {
        fontSizeVw = msg.font_size_vw;
      }
      if (typeof msg.line_count === "number" && msg.line_count >= 1) {
        setLineCount(Math.round(msg.line_count));
      } else {
        renderLines(lineTexts());
      }
      if (typeof msg.inset_vertical_pct === "number") {
        stage.style.setProperty("--inset-v", msg.inset_vertical_pct + "%");
      }
      if (typeof msg.inset_horizontal_pct === "number") {
        stage.style.setProperty("--inset-h", msg.inset_horizontal_pct + "%");
      }
      if (typeof msg.box_width_pct === "number") {
        stage.style.setProperty("--box-w", msg.box_width_pct + "%");
      }
      if (typeof msg.box_height_pct === "number") {
        stage.style.setProperty("--box-h", msg.box_height_pct + "%");
      }
    }

    function show() {
      stage.classList.remove("hidden");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => stage.classList.add("hidden"), 8000);
    }

    function clearLines() {
      renderLines(Array(lineCount).fill(""));
      stage.classList.add("hidden");
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(proto + "://" + location.host + "/ws");
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "overlay_style") {
          applyStyle(msg);
        }
        if (msg.type === "subtitle" && msg.text) {
          pushText(msg.text);
          show();
        }
        if (msg.type === "captions_state" && msg.is_active === false) {
          clearLines();
        }
      };
      ws.onclose = () => setTimeout(connect, 1500);
    }
    connect();
  </script>
</body>
</html>

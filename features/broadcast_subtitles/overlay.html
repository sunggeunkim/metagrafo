<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Metagrafo overlay</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    #stage {
      position: absolute;
      box-sizing: border-box;
      width: var(--box-w);
      max-width: calc(100% - 2 * var(--inset-h));
      max-height: var(--box-h);
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.6s;
      /* Base font size set here so the box height math scales perfectly */
      font-size: 2.5vw;
      --inset-v: 1%;
      --inset-h: 1%;
      --box-w: 100%;
      --box-h: 30%;
    }
    #stage.hidden { opacity: 0; }
    #stage.pos-top_left {
      top: var(--inset-v); left: var(--inset-h); right: auto; bottom: auto; text-align: left;
    }
    #stage.pos-top_center {
      top: var(--inset-v); left: var(--inset-h); right: var(--inset-h); bottom: auto; margin-left: auto; margin-right: auto; text-align: center;
    }
    #stage.pos-bottom_center {
      top: auto; left: var(--inset-h); right: var(--inset-h); bottom: var(--inset-v); margin-left: auto; margin-right: auto; text-align: center;
    }

    #lines {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      max-height: var(--box-h);
      overflow: hidden;
    }
    #stage.pos-top_center #lines,
    #stage.pos-bottom_center #lines {
      align-items: center;
    }

    .line {
      color: #fff;
      font-size: inherit;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.55);
      text-shadow:
        0 0 6px #000, 0 2px 8px #000, 2px 2px 0 #000,
        -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000;
      line-height: 1.35em;
      margin: 0.08em 0;
      padding: 0.06em 0.45em;
      width: fit-content;
      max-width: 100%;
      overflow-wrap: normal;
      word-break: normal;
    }
  </style>
</head>
<body>
  <div id="stage" class="hidden pos-top_left">
    <div id="lines"></div>
  </div>
  <script>
    const stage = document.getElementById("stage");
    const linesEl = document.getElementById("lines");
    const POSITIONS = ["pos-top_left", "pos-top_center", "pos-bottom_center"];
    let hideTimer = null;
    let fontSizeVw = 2.5;
    let lineCount = 2;
    let draftText = null;
    let committed = [];
    let renderRetry = false;

    function setLineCount(count) {
      lineCount = Math.round(count);
      render();
    }

    function measureRows(text) {
      const width = linesEl.clientWidth || stage.clientWidth;
      if (!text || width < 8) {
        return text ? [text] : [];
      }
      const probe = document.createElement("p");
      probe.className = "line";
      probe.style.position = "absolute";
      probe.style.visibility = "hidden";
      probe.style.left = "0";
      probe.style.top = "0";
      probe.style.width = width + "px";
      probe.style.maxWidth = width + "px";
      probe.textContent = text;
      stage.appendChild(probe);
      const node = probe.firstChild;
      const range = document.createRange();
      const rows = [];
      let start = 0;
      let lineTop = null;
      for (let i = 0; i < text.length; i++) {
        range.setStart(node, i);
        range.setEnd(node, i + 1);
        const top = range.getBoundingClientRect().top;
        if (lineTop === null) {
          lineTop = top;
        } else if (top > lineTop + 1) {
          rows.push(text.slice(start, i));
          start = i;
          lineTop = top;
        }
      }
      rows.push(text.slice(start));
      probe.remove();
      return rows.map((row) => row.trim()).filter(Boolean);
    }

    function render() {
      const width = linesEl.clientWidth || stage.clientWidth;
      if (width < 8) {
        if (!renderRetry) {
          renderRetry = true;
          requestAnimationFrame(() => {
            renderRetry = false;
            render();
          });
        }
        return;
      }
      const blocks = draftText !== null ? committed.concat(draftText) : committed;
      const rows = [];
      for (const block of blocks) {
        rows.push(...measureRows(block));
      }
      while (committed.length > 30) {
        committed.shift();
      }
      linesEl.replaceChildren();
      for (const row of rows.slice(-lineCount)) {
        const p = document.createElement("p");
        p.className = "line";
        p.textContent = row;
        linesEl.appendChild(p);
      }
    }

    function showDraft(text) {
      draftText = text;
      render();
    }

    function commitLine(text) {
      committed.push(text);
      draftText = null;
      render();
    }

    setLineCount(2);

    function applyStyle(msg) {
      if (msg.position) {
        stage.classList.remove(...POSITIONS);
        stage.classList.add("pos-" + msg.position);
      }
      if (typeof msg.font_size_vw === "number") {
        fontSizeVw = msg.font_size_vw;
        stage.style.fontSize = fontSizeVw + "vw";
      }
      if (typeof msg.line_count === "number" && msg.line_count >= 1) {
        lineCount = Math.round(msg.line_count);
      }
      if (typeof msg.inset_vertical_pct === "number") {
        stage.style.setProperty("--inset-v", msg.inset_vertical_pct + "%");
      }
      if (typeof msg.inset_horizontal_pct === "number") {
        stage.style.setProperty("--inset-h", msg.inset_horizontal_pct + "%");
      }
      if (typeof msg.box_width_pct === "number") {
        stage.style.setProperty("--box-w", msg.box_width_pct + "%");
      }
      if (typeof msg.box_height_pct === "number") {
        stage.style.setProperty("--box-h", msg.box_height_pct + "%");
      }
      render();
    }

    function show() {
      stage.classList.remove("hidden");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => stage.classList.add("hidden"), 8000);
    }

    function clearLines() {
      committed = [];
      draftText = null;
      linesEl.replaceChildren();
      stage.classList.add("hidden");
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(proto + "://" + location.host + "/ws");
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "overlay_style") {
          applyStyle(msg);
        }
        if (msg.type === "subtitle" && msg.text) {
          if (msg.provisional) {
            showDraft(msg.text);
          } else {
            commitLine(msg.text);
          }
          show();
        }
        if (msg.type === "captions_state" && msg.is_active === false) {
          clearLines();
        }
      };
      ws.onclose = () => setTimeout(connect, 1500);
    }
    connect();
  </script>
</body>
</html>
